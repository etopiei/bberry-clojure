<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BB Clojure Editor</title>
        <style type="text/css" media="screen"></style>
        <script src="js/scittle.js"></script>
        <script>
            scittle.core.disable_auto_eval();
        </script>
    </head>
    <body>
        <div>
            <pre id="editor" inputmode="none">;; Write Clojure here!</pre>
            <div id="output"></div>
        </div>
        <div class="view-toggle">
            <button onclick="changeView('code')">code</button>
            <button id="stdout-button" onclick="changeView('logs')">
                result
            </button>
            <button id="error-button" onclick="changeView('error')">err</button>
        </div>
        <div class="button-bar">
            <div class="top-buttons">
                <button onclick="insertOpenSquare()">[</button>
                <button onclick="insertCloseSquare()">]</button>
                <button onclick="insertBackslash()">\</button>
                <button onclick="insertOpenCurly()">{</button>
                <button onclick="insertCloseCurly()">}</button>
                <button onclick="insertPercent()">%</button>
                <button onclick="insertLt()">&lt;</button>
                <button onclick="insertGt()">&gt;</button>
                <button onclick="goToTop()">Top</button>
                <button onclick="goToBottom()">Bottom</button>
                <button onclick="goLeft()">⬅️</button>
                <button onclick="goRight()">➡️</button>
                <button onclick="goUp()">⬆️</button>
                <button onclick="goDown()">⬇️</button>
            </div>
            <div class="bottom-buttons">
                <button onclick="slurpForward()">Slurp</button>
                <button onclick="barfForward()">Barf</button>
                <button onclick="backwardSexp()">BSexp</button>
                <button onclick="forwardSexp()">FSexp</button>
                <button onclick="lineStart()">LStart</button>
                <button onclick="lineEnd()">LEnd</button>
                <button onclick="evalFile()">Eval</button>
                <button onclick="saveFile()">Download</button>
                <input type="file" id="fileElem" />
                <button id="fileSelect" type="button">Open</button>
            </div>
        </div>

        <script src="js/ace.js" type="text/javascript" charset="utf-8"></script>
        <script
            src="js/ext-language_tools.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script
            src="js/keybinding-emacs.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script
            src="js/paredit-bundle.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script
            src="js/ace.improvements.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script
            src="js/ace.ext.lang.codemarker.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script
            src="js/ace.ext.lang.ast-commands.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script
            src="js/ace.ext.keys.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script
            src="js/ace.ext.lang.paredit.js"
            type="text/javascript"
            charset="utf-8"
        ></script>
        <script>
            // Globals
            let currentView = "code";
            let stdout = "";
            let errorOut = "";

            const changeView = (newViewType) => {
                switch (newViewType) {
                    case "code":
                        editorEl = document.getElementById("editor");
                        editorEl.style.display = "block";
                        outputEl = document.getElementById("output");
                        outputEl.style.display = "none";
                        break;
                    case "logs":
                        editorEl = document.getElementById("editor");
                        editorEl.style.display = "none";
                        outputEl = document.getElementById("output");
                        outputEl.style.display = "block";
                        outputEl.innerHTML = stdout;
                        document.getElementById(
                            "stdout-button",
                        ).style.backgroundColor = "black";
                        break;
                    case "error":
                        editorEl = document.getElementById("editor");
                        editorEl.style.display = "none";
                        outputEl = document.getElementById("output");
                        outputEl.style.display = "block";
                        outputEl.innerHTML = errorOut;
                        document.getElementById(
                            "error-button",
                        ).style.backgroundColor = "black";
                        break;
                }
            };

            // Editor commands
            const slurpForward = () => {
                editor.execCommand("paredit-slurpSexp");
            };
            const barfForward = () => {
                editor.execCommand("paredit-barfSexp");
            };
            const type = (val) => {
                editor.insert(val);
                editor.focus();
            };
            const insertLt = () => {
                type("<");
            };
            const insertGt = () => {
                type(">");
            };
            const insertPercent = () => {
                type("%");
            };
            const insertCloseCurly = () => {
                type("}");
            };
            const insertOpenCurly = () => {
                type("{");
                type("}");
                position = editor.getCursorPosition();
                editor.navigateTo(position.row, position.column - 1);
                editor.focus();
            };
            const insertBackslash = () => {
                type("\\");
            };
            const insertCloseSquare = () => {
                type("]");
            };
            const insertOpenSquare = () => {
                type("[");
                type("]");
                position = editor.getCursorPosition();
                editor.navigateTo(position.row, position.column - 1);
                editor.focus();
            };
            const lineEnd = () => {
                editor.navigateLineEnd();
                editor.focus();
            };
            const lineStart = () => {
                editor.navigateLineStart();
                editor.focus();
            };
            const goToTop = () => {
                editor.navigateTo(0, editor.getCursorPosition().column);
                editor.focus();
            };
            const goToBottom = () => {
                const totalLines = Math.max(1, editor.getSession().getLength());
                editor.navigateTo(
                    totalLines - 1,
                    editor.getCursorPosition().column,
                );
                editor.focus();
            };
            const goLeft = () => {
                position = editor.getCursorPosition();
                editor.navigateTo(position.row, position.column - 1);
                editor.focus();
            };
            const goRight = () => {
                position = editor.getCursorPosition();
                editor.navigateTo(position.row, position.column + 1);
                editor.focus();
            };
            const goUp = () => {
                position = editor.getCursorPosition();
                editor.navigateTo(position.row - 1, position.column);
                editor.focus();
            };
            const goDown = () => {
                position = editor.getCursorPosition();
                editor.navigateTo(position.row + 1, position.column);
                editor.focus();
            };
            const forwardSexp = () => {
                const ast = window.paredit.parse(editor.getValue());
                const idx = editor.getCursorIndex();
                const newIndex = window.paredit.navigator.forwardSexp(ast, idx);
                editor.moveCursorToIndex(newIndex);
                editor.focus();
            };
            const backwardSexp = () => {
                const ast = window.paredit.parse(editor.getValue());
                const idx = editor.getCursorIndex();
                const newIndex = window.paredit.navigator.backwardSexp(
                    ast,
                    idx,
                );
                editor.moveCursorToIndex(newIndex);
                editor.focus();
            };
            const evalFile = () => {
                try {
                    result = window.scittle.core.eval_string(editor.getValue());
                    stdout += "<br>" + result;
                    document.getElementById(
                        "stdout-button",
                    ).style.backgroundColor = "red";
                } catch (e) {
                    errorOut += "<br>" + e.message;
                    document.getElementById(
                        "error-button",
                    ).style.backgroundColor = "red";
                }
            };

            // Save and load files
            const saveFile = () => {
                download("main.clj", editor.getValue());
            };

            function download(filename, text) {
                var element = document.createElement("a");
                element.setAttribute(
                    "href",
                    "charset=utf-8," + encodeURIComponent(text),
                );
                element.setAttribute("download", filename);

                element.style.display = "none";
                document.body.appendChild(element);

                element.click();

                document.body.removeChild(element);
            }

            const fileSelect = document.getElementById("fileSelect");
            const fileElem = document.getElementById("fileElem");

            fileSelect.addEventListener("click", (e) => {
                if (fileElem) {
                    fileElem.click();
                }
            });

            fileElem.addEventListener("change", handleFiles);

            function handleFiles() {
                const files = fileElem.files;
                if (files.length) {
                    const reader = new FileReader();
                    reader.addEventListener("load", () => {
                        editor.setValue(reader.result);
                        lineEnd();
                    });
                    reader.readAsText(files[0]);
                }
            }

            // Editor setup
            const editor = ace.edit("editor");
            editor.setTheme("ace/theme/solarized_light");
            editor.getSession().setMode("ace/mode/clojure");

            editor.setOptions({
                enableBasicAutocompletion: true,
                enableSnippets: true,
                showGutter: false,
                highlightActiveLine: false,
                showPrintMargin: false,
                fontSize: 16,
            });

            editor.keyBinding.addKeyboardHandler(
                ace.require("ace/keyboard/emacs").handler,
            );
            const occurStartCommand = ace.require(
                "ace/commands/occur_commands",
            ).occurStartCommand;
            editor.commands.addCommand(occurStartCommand);
            editor.focus();
            window.editor = editor;
        </script>
    </body>
</html>

<style>
    body {
        overflow: hidden;
        width: 100%;
    }
    #editor {
        margin: 0;
        top: 0;
        left: 0;
        position: absolute;
        width: 100%;
        height: calc(100% - 110px);
        overflow-y: scroll;
    }
    .ace-syntax-error {
        position: absolute;
        border-radius: 3px;
        background: rgba(255, 0, 0, 0.7);
    }
    .button-bar {
        position: absolute;
        bottom: 2px;
        left: 0;
        width: 100%;
    }
    .button-bar div {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: center;
    }
    .button-bar div button {
        padding: 16px;
    }
    .view-toggle {
        position: absolute;
        top: 4px;
        right: 4px;
    }
    .view-toggle button {
        background-color: rgba(0, 0, 0, 1);
        color: rgb(255, 255, 255);
        padding: 6px;
    }
    #fileElem {
        display: none;
    }
    #output {
        display: none;
        top: 0;
        left: 0;
        position: absolute;
        background-color: black;
        color: white;
        font-family: monospace;
        width: 100%;
        height: calc(100% - 110px);
        overflow-y: scroll;
    }
</style>
